<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combatientes RPG - Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 400px; background-color: #1e293b; border: 4px solid #f59e0b; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0px 10px 25px rgba(0,0,0,0.8); }
        input, button { width: 100%; margin: 10px 0; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        input { background-color: #0f172a; border: 1px solid #334155; color: white; }
        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; }
        .btn-secondary { background-color: #10b981; color: white; border: none; cursor: pointer; }
        .btn-action { background-color: #f59e0b; color: #0b0f19; border: none; cursor: pointer; font-size: 16px; margin-top: 15px;}
        #game-screen { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="container">
        <h1 style="color: #fbbf24; margin-bottom: 10px;">RPG Online</h1>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Inicia sesión o regístrate.</p>
        
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        
        <button class="btn-primary" onclick="iniciarSesion()">Entrar al Juego</button>
        <button class="btn-secondary" onclick="crearCuenta()">Crear Cuenta Nueva</button>
    </div>

    <div id="game-screen" class="container">
        <h2 style="color: #10b981;">Refugio Seguro</h2>
        <p id="datos-jugador" style="font-size: 16px; margin-top: 10px; color: #fbbf24; font-weight: bold;"></p>
        
        <button class="btn-action" onclick="cazarMonstruos()">⚔️ Cazar Monstruos</button>
        
        <button class="btn-primary" style="background-color: #ef4444; margin-top: 30px;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        const supabaseUrl = 'https://gzzkovrrrucwhiuwzvki.supabase.co';
        const supabaseKey = 'sb_publishable_QwAtprHGKyqQPb1bHBJWLg_oWpderNM';
        const cliente = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Variables globales para recordar quién está jugando
        let miUsuarioId = null;
        let miOro = 0;

        async function crearCuenta() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Error: Faltan datos.");
            
            const { data, error } = await cliente.auth.signUp({ email: email, password: password });
            if (error) return alert("Error: " + error.message);

            const { error: dbError } = await cliente.from('perfiles').insert([
                { id: data.user.id, username: email.split('@')[0], oro: 50 }
            ]);
            
            if (dbError) return alert("Error al guardar perfil: " + dbError.message);
            alert("¡Cuenta creada! Ya puedes Entrar al Juego.");
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await cliente.auth.signInWithPassword({ email: email, password: password });
            if (error) return alert("Credenciales incorrectas.");

            const perfil = await cliente.from('perfiles').select('*').eq('id', data.user.id).single();
            if (perfil.error) return alert("Error buscando oro.");

            // Guardamos los datos en la memoria del navegador
            miUsuarioId = data.user.id;
            miOro = perfil.data.oro;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('datos-jugador').innerText = "Tu Oro: " + miOro + " 💰";
        }

        // NUEVA FUNCIÓN: CAZAR MONSTRUOS (Actualizar Datos)
        async function cazarMonstruos() {
            document.getElementById('datos-jugador').innerText = "Peleando... ⚔️";

            // Calculamos oro al azar entre 1 y 15
            const oroGanado = Math.floor(Math.random() * 15) + 1;
            miOro = miOro + oroGanado;

            // Actualizamos la base de datos en Supabase
            const { error } = await cliente.from('perfiles')
                .update({ oro: miOro })
                .eq('id', miUsuarioId);

            if (error) {
                alert("Hubo un error al guardar tu oro: " + error.message);
            } else {
                document.getElementById('datos-jugador').innerText = "Tu Oro: " + miOro + " 💰 (Ganaste +" + oroGanado + ")";
            }
        }

        async function cerrarSesion() {
            await cliente.auth.signOut();
            miUsuarioId = null;
            miOro = 0;
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
