<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Pokémon Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #1e293b; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        /* Tema Pokédex */
        .container { width: 100%; max-width: 400px; background-color: #f8fafc; border: 8px solid #dc2626; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0px 10px 25px rgba(0,0,0,0.8); color: #0f172a;}
        
        input, button { width: 100%; margin: 10px 0; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        input { background-color: #f1f5f9; border: 2px solid #cbd5e1; color: #0f172a; }
        
        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; border-bottom: 4px solid #1e40af;}
        .btn-secondary { background-color: #10b981; color: white; border: none; cursor: pointer; border-bottom: 4px solid #047857;}
        .btn-action { background-color: #22c55e; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 15px; border-bottom: 4px solid #166534;}
        .btn-shop { background-color: #f59e0b; color: #0f172a; border: none; cursor: pointer; margin-top: 5px; font-size: 13px; border-bottom: 4px solid #b45309;}
        .btn-danger { background-color: #ef4444; color: white; border: none; cursor: pointer; border-bottom: 4px solid #b91c1c; margin-top: 20px;}
        
        #game-screen { display: none; }
        
        .section { margin-top: 20px; border-top: 2px dashed #cbd5e1; padding-top: 15px; text-align: left; }
        .section h3 { color: #dc2626; margin-bottom: 10px; text-align: center; font-size: 18px; text-transform: uppercase;}
        
        ul { list-style: none; padding: 0; }
        li { background: #e2e8f0; margin: 5px 0; padding: 10px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; border: 1px solid #cbd5e1; font-weight: bold;}
        
        .pokemon-text { font-size: 14px; margin-top: 10px; color: #dc2626; font-weight: bold; min-height: 20px;}
    </style>
</head>
<body>

    <div id="auth-screen" class="container">
        <h1 style="color: #dc2626; margin-bottom: 5px;">🔴 POKÉ-RPG ⚪</h1>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Identifícate, Entrenador.</p>
        
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        
        <button class="btn-primary" onclick="iniciarSesion()">Entrar al Mundo</button>
        <button class="btn-secondary" onclick="crearCuenta()">Nuevo Entrenador</button>
    </div>

    <div id="game-screen" class="container">
        <h2 style="color: #2563eb;">Centro Pokémon 🏥</h2>
        <p id="datos-jugador" style="font-size: 18px; margin-top: 10px; color: #0f172a; font-weight: bold;"></p>
        <p id="accion-texto" class="pokemon-text"></p>
        
        <button class="btn-action" onclick="explorarHierba()">🌿 Explorar Hierba Alta</button>
        
        <div class="section">
            <h3>Poké Mart 🏪</h3>
            <button class="btn-shop" onclick="comprar('Pokéball', 50)">🔴 Comprar Pokéball (50 ₽)</button>
            <button class="btn-shop" onclick="comprar('Poción', 20)">🧴 Comprar Poción (20 ₽)</button>
        </div>

        <div class="section">
            <h3>Liga Pokémon 🏆</h3>
            <ul id="lista-top"></ul>
        </div>
        
        <button class="btn-danger" onclick="cerrarSesion()">Cerrar Sesión / Guardar</button>
    </div>

    <script>
        const supabaseUrl = 'https://gzzkovrrrucwhiuwzvki.supabase.co';
        const supabaseKey = 'sb_publishable_QwAtprHGKyqQPb1bHBJWLg_oWpderNM';
        const cliente = window.supabase.createClient(supabaseUrl, supabaseKey);

        let miUsuarioId = null;
        let miOro = 0;

        const listaPokemones = ["Pidgey 🐦", "Rattata 🐀", "Pikachu ⚡", "Charmander 🔥", "Squirtle 💧", "Bulbasaur 🍃", "Zubat 🦇", "Geodude 🪨", "Snorlax 💤", "Mewtwo 🌌"];

        async function crearCuenta() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Error: Faltan datos.");
            
            const { data, error } = await cliente.auth.signUp({ email: email, password: password });
            if (error) return alert("Error: " + error.message);

            // Te regalamos 100 Pokédolares iniciales (se guardan en tu columna 'oro')
            const { error: dbError } = await cliente.from('perfiles').insert([
                { id: data.user.id, username: email.split('@')[0], oro: 100 }
            ]);
            
            if (dbError) return alert("Error al registrar entrenador: " + dbError.message);
            alert("¡Licencia de Entrenador creada! Ya puedes entrar.");
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await cliente.auth.signInWithPassword({ email: email, password: password });
            if (error) return alert("Datos incorrectos.");

            const perfil = await cliente.from('perfiles').select('*').eq('id', data.user.id).single();
            if (perfil.error) return alert("Error leyendo tu perfil.");

            miUsuarioId = data.user.id;
            miOro = perfil.data.oro;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            actualizarUI();
            mostrarTop();
        }

        async function explorarHierba() {
            const pokeAlAzar = listaPokemones[Math.floor(Math.random() * listaPokemones.length)];
            document.getElementById('accion-texto').innerText = "Caminando por la hierba...";

            setTimeout(async () => {
                // Ganancia aleatoria entre 5 y 25 Pokédólares
                const ganancia = Math.floor(Math.random() * 20) + 5;
                miOro += ganancia;

                const { error } = await cliente.from('perfiles').update({ oro: miOro }).eq('id', miUsuarioId);

                if (!error) {
                    document.getElementById('accion-texto').innerText = `¡Un salvaje ${pokeAlAzar} apareció! Lo venciste y ganaste ${ganancia} ₽.`;
                    actualizarUI();
                    mostrarTop();
                } else {
                    document.getElementById('accion-texto').innerText = "Error de conexión con la Pokédex.";
                }
            }, 800); // Pequeña pausa para dar emoción
        }

        async function comprar(item, costo) {
            if (miOro < costo) {
                return alert("¡No tienes suficientes Pokédólares para esta compra!");
            }
            
            miOro -= costo;
            const { error } = await cliente.from('perfiles').update({ oro: miOro }).eq('id', miUsuarioId);
            
            if (!error) {
                document.getElementById('accion-texto').innerText = `Compraste: ${item} por ${costo} ₽.`;
                actualizarUI();
                mostrarTop();
            } else {
                miOro += costo; // Devolvemos el dinero si falla
            }
        }

        async function mostrarTop() {
            const lista = document.getElementById('lista-top');
            lista.innerHTML = "<li>Conectando con la Liga...</li>";

            const { data, error } = await cliente.from('perfiles')
                .select('username, oro')
                .order('oro', { ascending: false })
                .limit(4);

            if (error) {
                lista.innerHTML = "<li>Error al cargar la Liga</li>";
                return;
            }

            lista.innerHTML = data.map((jugador, index) => {
                let medalla = "🏅";
                if (index === 0) medalla = "👑";
                if (index === 1) medalla = "🥈";
                if (index === 2) medalla = "🥉";
                return `<li><span>${medalla} ${jugador.username}</span> <span>${jugador.oro} ₽</span></li>`;
            }).join('');
        }

        function actualizarUI() {
            document.getElementById('datos-jugador').innerText = `Cartera: ${miOro} ₽`;
        }

        async function cerrarSesion() {
            await cliente.auth.signOut();
            miUsuarioId = null;
            miOro = 0;
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('accion-texto').innerText = '';
        }
    </script>
</body>
</html>
